# Publishes Claude_in_Science_workshop/public/ with GitHub Pages.
# Skipped while the repo is private; after making it public, run it once from the Actions tab.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - Claude_in_Science_workshop/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Claude_in_Science_workshop/public
      - id: deployment
        uses: actions/deploy-pages@v4
